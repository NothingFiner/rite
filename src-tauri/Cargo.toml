[package]
name = "rite"
version = "0.1.0"
description = "A minimal word processor"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5.1", features = [] }

[dependencies]
tauri = { version = "1.6.1", features = [ "window-start-dragging", "macos-private-api", "dialog-all", "fs-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2.5"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
# HTTP client for the LLM proxy. `stream` for SSE chunk reading; `rustls-tls`
# so HTTPS cloud endpoints (Ollama Cloud) work without OpenSSL (builds clean on
# macOS). `default-features = false` keeps the dep small.
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
# `futures-util` brings the `StreamExt` trait into scope for SSE chunk
# iteration (`bytes_stream().next()`). reqwest's `stream` feature re-exports
# the types but not the trait prelude, so this is a direct dep.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# DOCX export (`export_docx.rs`). A `.docx` is a ZIP of OOXML parts; we emit the
# XML ourselves (transparent, no opaque heavy dependency) and let `zip` do the
# deflate+archive. `deflate` is the only feature needed; `default-features =
# false` drops the unused `aes-crypto`/`time`/`bzip2` machinery so the dep stays
# small. Chosen over a high-level `docx-rs` crate for build reliability on this
# Tauri v1 setup and so the output is plain readable OOXML that round-trips
# with the existing mammoth-based import path.
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
# Enables `tauri::test` (mock app/builder) so command tests can construct a
# `State<AppState>` without spinning up the full Tauri runtime. Only active
# during `cargo test`; never compiled into production builds.
tauri = { version = "1.6.1", features = ["test"] }
